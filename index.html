<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA TERMINAL</title>
    <!-- Dynamic Pulse SVG Favicon matching the header status indicator -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><style>circle{animation:pulse 2s infinite;}@keyframes pulse{0%{r:20;opacity:1;}50%{r:35;opacity:0.4;}100%{r:20;opacity:1;}}</style><circle cx='50' cy='50' r='25' fill='%2310b981'/></svg>">
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0d14;
            --bg-secondary: #121824;
            --bg-tertiary: #1a2234;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #1f2937;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Main Dashboard Grid */
        .dashboard-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            flex-grow: 1;
        }

        /* Sidebar Navigation & Info */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .job-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .job-link-btn:hover {
            border-color: var(--accent-color);
            background-color: rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }

        /* Social X Box */
        .social-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            padding: 0.85rem 1rem;
            border-radius: 6px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .social-box:hover {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px);
        }

        .social-box i {
            font-size: 1.1rem;
        }

        /* Main Workspace & Converter */
        .main-workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .converter-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 1rem;
            align-items: center;
        }

        .code-editor-box {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            height: 380px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            color: #34d399;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .controls-column {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .select-control {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem;
            border-radius: 6px;
            outline: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* Terminal Output Log */
        .terminal-log {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-height: 120px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 0.25rem;
        }

        .log-time {
            color: var(--accent-color);
        }

        .log-success {
            color: var(--success-color);
        }

        .log-error {
            color: var(--danger-color);
        }

        @media (max-width: 992px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
            .converter-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="brand-container">
            <i class="fa-solid font-awesome fa-terminal" style="color: var(--accent-color);"></i>
            <span class="brand-name">ASTRA TERMINAL</span>
        </div>
        <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span>ALL SYSTEMS NOMINAL</span>
        </div>
    </header>

    <!-- Dashboard Content -->
    <div class="dashboard-container">
        
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-gamepad"></i> GTA Online PS5 Job
                </div>
                <a href="https://socialclub.rockstargames.com/job/gtav/g68ljFI7FkWp0S0PaTe3vA" target="_blank" rel="noopener noreferrer" class="job-link-btn">
                    <span>Free Special Mk2 Weapons (PS5)</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-share-nodes"></i> Community & Updates
                </div>
                <a href="https://x.com/AstraN9ne99" target="_blank" rel="noopener noreferrer" class="social-box">
                    <i class="fa-brands fa-x-twitter"></i>
                    <span>Follow @AstraN9ne99 on X</span>
                </a>
            </div>
        </div>

        <!-- Main Workspace -->
        <div class="main-workspace">
            <div class="panel">
                <div class="panel-title">
                    <i class="fa-solid fa-code"></i> Data Converter & Transformer
                </div>
                
                <div class="converter-container">
                    <!-- Input Block -->
                    <div class="code-editor-box">
                        <div class="editor-header">
                            <span>Input Payload</span>
                            <button class="btn" onclick="clearInput()"><i class="fa-solid fa-trash"></i> Clear</button>
                        </div>
                        <textarea id="jsonInput" placeholder="Paste JSON or XML string here..."></textarea>
                    </div>

                    <!-- Controls Block -->
                    <div class="controls-column">
                        <label for="conversionType" style="font-size: 0.75rem; color: var(--text-secondary);">Conversion Mode</label>
                        <select id="conversionType" class="select-control">
                            <option value="json2xml">JSON to XML</option>
                            <option value="xml2json">XML to JSON</option>
                            <option value="minify">Minify JSON</option>
                            <option value="prettify">Prettify JSON</option>
                        </select>
                        <button class="btn btn-primary" onclick="processData()">
                            <i class="fa-solid fa-arrows-rotate"></i> Convert
                        </button>
                    </div>

                    <!-- Output Block -->
                    <div class="code-editor-box">
                        <div class="editor-header">
                            <span>Formatted Output</span>
                            <button class="btn" onclick="copyOutput()"><i class="fa-solid fa-copy"></i> Copy</button>
                        </div>
                        <textarea id="jsonOutput" readonly placeholder="Output payload will appear here..."></textarea>
                    </div>
                </div>
            </div>

            <!-- System Logs -->
            <div class="terminal-log" id="terminalLog">
                <div class="log-entry"><span class="log-time">[SYSTEM]</span> Astra Terminal initialised successfully.</div>
            </div>
        </div>

    </div>

    <!-- Conversion & Core Utilities Script -->
    <script>
        function logMessage(msg, type = 'normal') {
            const logContainer = document.getElementById('terminalLog');
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            let typeClass = '';
            if (type === 'success') typeClass = 'log-success';
            if (type === 'error') typeClass = 'log-error';

            logEntry.innerHTML = `<span class="log-time">[${time}]</span> <span class="${typeClass}">${msg}</span>`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // XML to JSON & JSON to XML Helpers
        function jsonToXml(obj, nodeName = 'root') {
            let xml = '';
            if (typeof obj === 'object' && obj !== null) {
                for (let prop in obj) {
                    if (obj.hasOwnProperty(prop)) {
                        if (Array.isArray(obj[prop])) {
                            obj[prop].forEach(item => {
                                xml += jsonToXml(item, prop);
                            });
                        } else if (typeof obj[prop] === 'object') {
                            xml += jsonToXml(obj[prop], prop);
                        } else {
                            xml += `<${prop}>${obj[prop]}</${prop}>`;
                        }
                    }
                }
            } else {
                xml += obj;
            }
            return `<${nodeName}>${xml}</${nodeName}>`;
        }

        function xmlToJson(xml) {
            let obj = {};
            if (xml.nodeType === 1) { // element
                if (xml.attributes.length > 0) {
                    obj["@attributes"] = {};
                    for (let j = 0; j < xml.attributes.length; j++) {
                        let attribute = xml.attributes.item(j);
                        obj["@attributes"][attribute.nodeName] = attribute.nodeValue;
                    }
                }
            } else if (xml.nodeType === 3) { // text
                obj = xml.nodeValue.trim();
            }

            if (xml.hasChildNodes()) {
                for (let i = 0; i < xml.childNodes.length; i++) {
                    let item = xml.childNodes.item(i);
                    let nodeName = item.nodeName;
                    if (nodeName === "#text") {
                        let text = item.nodeValue.trim();
                        if (text !== "") return text;
                        continue;
                    }
                    if (typeof (obj[nodeName]) == "undefined") {
                        obj[nodeName] = xmlToJson(item);
                    } else {
                        if (typeof (obj[nodeName].push) == "undefined") {
                            let old = obj[nodeName];
                            obj[nodeName] = [];
                            obj[nodeName].push(old);
                        }
                        obj[nodeName].push(xmlToJson(item));
                    }
                }
            }
            return obj;
        }

        function processData() {
            const input = document.getElementById('jsonInput').value.trim();
            const output = document.getElementById('jsonOutput');
            const mode = document.getElementById('conversionType').value;

            if (!input) {
                logMessage("Input payload is empty.", "error");
                return;
            }

            try {
                if (mode === "json2xml") {
                    const parsedJson = JSON.parse(input);
                    const xmlResult = jsonToXml(parsedJson);
                    output.value = xmlResult;
                    logMessage("Successfully converted JSON to XML.", "success");
                } else if (mode === "xml2json") {
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(input, "text/xml");
                    const jsonResult = xmlToJson(xmlDoc);
                    output.value = JSON.stringify(jsonResult, null, 2);
                    logMessage("Successfully converted XML to JSON.", "success");
                } else if (mode === "prettify") {
                    const parsed = JSON.parse(input);
                    output.value = JSON.stringify(parsed, null, 4);
                    logMessage("JSON Prettified successfully.", "success");
                } else if (mode === "minify") {
                    const parsed = JSON.parse(input);
                    output.value = JSON.stringify(parsed);
                    logMessage("JSON Minified successfully.", "success");
                }
            } catch (err) {
                logMessage("Parsing error: " + err.message, "error");
            }
        }

        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('jsonOutput').value = '';
            logMessage("Editors cleared.");
        }

        function copyOutput() {
            const output = document.getElementById('jsonOutput');
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            logMessage("Output copied to clipboard.", "success");
        }
    </script>
</body>
</html>
